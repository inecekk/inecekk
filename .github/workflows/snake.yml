name: generate github contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: inecekk
          outputs: |
            dist/github-snake.svg?length=9
            dist/github-snake-dark.svg?palette=github-dark&length=9
            dist/github-snake-snakes.svg?palette=snakes&color_snakes=#e879f9&color_dots=#c4b5fd&length=9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update snake animation [skip ci]"
          git push
