<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-label="inecekk rainbow title">
  <defs>
    <linearGradient id="rainbow-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="14%" stop-color="#f97316" />
      <stop offset="28%" stop-color="#facc15" />
      <stop offset="42%" stop-color="#22c55e" />
      <stop offset="57%" stop-color="#3b82f6" />
      <stop offset="71%" stop-color="#8b5cf6" />
      <stop offset="85%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ef4444" />
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="10s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="rainbow-static" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="17%" stop-color="#f59e0b" />
      <stop offset="33%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="67%" stop-color="#3b82f6" />
      <stop offset="83%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
  </defs>
  <style>
    @keyframes flow {
      0% { transform: translateX(0); }
      100% { transform: translateX(900px); }
    }
    text { animation: flow 10s linear infinite; }
  </style>
  <text x="450" y="92" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="72" font-weight="bold" fill="url(#rainbow-static)" stroke="#1a1b26" stroke-width="2">inecekk</text>
  <text x="450" y="124" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" font-weight="bold" fill="url(#rainbow-static)">ARCH LINUX &middot; NIRI &middot; BTRFS</text>
</svg>
